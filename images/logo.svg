<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0f1d1a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- search field -->
  <g filter="url(#shadow)">
    <rect x="300" y="110" width="680" height="96" rx="48" fill="#1d2530" stroke="#2fbf9f" stroke-width="4"/>
  </g>
  <g transform="translate(360 158)" fill="none" stroke="#2fbf9f" stroke-width="9" stroke-linecap="round">
    <circle cx="0" cy="-6" r="20"/>
    <path d="M15 9 L31 25"/>
  </g>
  <text x="420" y="172" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="46" font-weight="600" fill="#f2f4f7">kimi no na wa</text>

  <!-- the same title in other scripts -->
  <g font-family="Segoe UI, Yu Gothic, Malgun Gothic, Microsoft YaHei, Arial, sans-serif" font-size="40" fill="#f2f4f7">
    <text x="330" y="290" opacity=".85">君の名は。</text>
    <text x="560" y="290" opacity=".7">Your Name.</text>
    <text x="800" y="290" opacity=".55">너의 이름은.</text>
    <text x="400" y="355" opacity=".5">你的名字</text>
    <text x="620" y="355" opacity=".6">Kimi no Na wa.</text>
  </g>

  <text x="640" y="560" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif" font-weight="700" font-size="104" fill="#f2f4f7" letter-spacing="1">Alternative <tspan fill="#2fbf9f">Titles</tspan></text>
</svg>
